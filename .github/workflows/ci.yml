name: CI

on:
  pull_request:
    branches: [dev, stage, prod]
  push:
    branches: [dev, stage, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs; Dependabot keeps them current.
jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # --if-present: a repo only runs the steps its package.json defines.
      - run: npm run format:check --if-present
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present

  branch-flow:
    name: branch-flow (dev → stage → prod)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Only dev may merge into stage, and only stage into prod
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "stage" ] && [ "$HEAD" != "dev" ]; then
            echo "PRs into stage must come from dev (this one is from $HEAD)." >&2; exit 1
          fi
          if [ "$BASE" = "prod" ] && [ "$HEAD" != "stage" ]; then
            echo "PRs into prod must come from stage (this one is from $HEAD)." >&2; exit 1
          fi

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Image zricethezav/gitleaks v8.30.1, pinned by digest.
      - name: Scan the full history for secrets
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner .

  security-deps:
    name: security-deps (OSV-Scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Warning only on dev; blocking on stage and prod. Image osv-scanner v2.7.0, pinned by digest.
      - id: osv
        continue-on-error: ${{ github.base_ref == 'dev' || github.ref == 'refs/heads/dev' }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 \
            scan source -r .
      - if: steps.osv.outcome == 'failure'
        run: echo "::warning title=OSV-Scanner::Findings above. Warning only on dev; this blocks stage and prod."
